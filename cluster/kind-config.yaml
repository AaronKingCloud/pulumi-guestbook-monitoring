# Local kind cluster. The Grafana and Prometheus NodePorts are mapped to
# localhost so they can be reached from the host without port-forwarding.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: guestbook
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30300   # Grafana NodePort
        hostPort: 3000
      - containerPort: 30090   # Prometheus NodePort
        hostPort: 9090
